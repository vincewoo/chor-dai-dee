version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: chor-dai-dee-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Persist the database
      - ./server/database.sqlite:/app/database.sqlite
    environment:
      - NODE_ENV=production
    networks:
      - chor-dai-dee-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: chor-dai-dee-client
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - server
    networks:
      - chor-dai-dee-network

networks:
  chor-dai-dee-network:
    driver: bridge