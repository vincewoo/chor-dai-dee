version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: chor-dai-dee-server
    restart: unless-stopped
    volumes:
      # Persist the database using a named volume
      - server-data:/data
    environment:
      - NODE_ENV=production
    network_mode: service:tailscale
    depends_on:
      - tailscale
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: chor-dai-dee-client
    restart: unless-stopped
    volumes:
      - ./certs:/etc/nginx/certs:ro
    network_mode: service:tailscale
    depends_on:
      - server
      - tailscale

  tailscale:
    image: tailscale/tailscale:latest
    container_name: chor-dai-dee-tailscale
    hostname: chor-dai-dee
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_HOSTNAME=chor-dai-dee
      - TS_ACCEPT_DNS=false
      - TS_CERT_DOMAIN=chor-dai-dee.tail83fc6d.ts.net
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped

volumes:
  server-data:
  tailscale-state: