<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Chor Dai Dee</title>

    <!-- PWA Meta Tags -->
    <meta name="description" content="Multiplayer Big 2 card game with advanced AI and statistics tracking" />
    <!-- Matches the felt gradient's edge stop (tableTheme FELT_BASE) and the
         html/body background in index.css, so browser/system chrome blends
         with the table instead of framing it. -->
    <meta name="theme-color" content="#0c3a23" />
    <!-- The manifest link is injected by vite-plugin-pwa (points at
         /manifest.webmanifest); do not add one by hand. Per spec the first
         rel=manifest in tree order wins, so the hand-written link that used to
         sit here won and silently overrode every value configured in
         vite.config.js. -->

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Do not use black-translucent here. In an installed viewport-fit=cover
         PWA, WebKit can offset bottom:0 by both the top and bottom safe-area
         insets in that mode, leaving a large unreachable band below the app.
         `black` keeps light status-bar icons without enabling that broken
         translucent viewport geometry. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Chor Dai Dee" />

    <!-- MS Tile -->
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png" />
    <meta name="msapplication-TileColor" content="#0c3a23" />
    <!-- Outfit font is self-hosted via @fontsource/outfit, imported in main.jsx -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
