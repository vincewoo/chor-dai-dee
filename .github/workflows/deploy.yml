name: Deploy to Synology

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        working-directory: ./client
        run: npm ci

      - name: Build client
        working-directory: ./client
        run: npm run build

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SYNOLOGY_SSH_KEY }}
          SYNOLOGY_PORT: ${{ secrets.SYNOLOGY_SSH_PORT }}
          SYNOLOGY_IP: ${{ secrets.SYNOLOGY_TAILSCALE_IP }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/synology_key
          chmod 600 ~/.ssh/synology_key

          # Add host key with retries (ssh-keyscan can be flaky)
          for i in 1 2 3; do
            echo "Attempt $i: Scanning SSH host keys..."
            if ssh-keyscan -T 10 -H -p ${SYNOLOGY_PORT} ${SYNOLOGY_IP} >> ~/.ssh/known_hosts 2>/dev/null; then
              echo "Successfully obtained host keys"
              break
            fi
            if [ $i -lt 3 ]; then
              echo "Failed, retrying in 5 seconds..."
              sleep 5
            else
              echo "Failed after 3 attempts, continuing anyway (strict host checking will be disabled)"
            fi
          done

      - name: Copy files to Synology
        env:
          SYNOLOGY_IP: ${{ secrets.SYNOLOGY_TAILSCALE_IP }}
          SYNOLOGY_USER: ${{ secrets.SYNOLOGY_USER }}
          SYNOLOGY_PORT: ${{ secrets.SYNOLOGY_SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.SYNOLOGY_DEPLOY_PATH }}
        run: |
          # Create deployment directory if it doesn't exist
          ssh -i ~/.ssh/synology_key -p ${SYNOLOGY_PORT} -o StrictHostKeyChecking=accept-new ${SYNOLOGY_USER}@${SYNOLOGY_IP} "mkdir -p ${DEPLOY_PATH}"

          # Copy application files
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/synology_key -p ${SYNOLOGY_PORT} -o StrictHostKeyChecking=accept-new" \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude 'client/node_modules' \
            --exclude 'server/node_modules' \
            --exclude 'server/database.sqlite' \
            --exclude 'certs' \
            --exclude '.env' \
            ./ ${SYNOLOGY_USER}@${SYNOLOGY_IP}:${DEPLOY_PATH}/

      - name: Deploy with Docker Compose
        env:
          SYNOLOGY_IP: ${{ secrets.SYNOLOGY_TAILSCALE_IP }}
          SYNOLOGY_USER: ${{ secrets.SYNOLOGY_USER }}
          SYNOLOGY_PORT: ${{ secrets.SYNOLOGY_SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.SYNOLOGY_DEPLOY_PATH }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          ssh -i ~/.ssh/synology_key -p ${SYNOLOGY_PORT} -o StrictHostKeyChecking=accept-new ${SYNOLOGY_USER}@${SYNOLOGY_IP} << EOF
            cd ${DEPLOY_PATH}

            # Create .env file with Tailscale auth key
            echo "TS_AUTHKEY=${TS_AUTHKEY}" > .env

            # Pull latest images and rebuild
            sudo docker-compose pull
            sudo docker-compose build --no-cache

            # Stop and remove old containers
            sudo docker-compose down

            # Create certs directory if it doesn't exist
            mkdir -p certs

            # Start new containers (docker-compose will read .env automatically)
            sudo docker-compose up -d

            # Wait for Tailscale to authenticate
            echo "Waiting for Tailscale to authenticate..."
            sleep 10

            # Enable Tailscale Funnel for public HTTPS access (this also provisions certificates)
            echo "Enabling Tailscale Funnel on port 443..."
            sudo docker-compose exec -T tailscale tailscale funnel 443 on || echo "Funnel configuration initiated"

            # Wait for Funnel to provision certificates
            echo "Waiting for Funnel to provision certificates..."
            sleep 10

            # Try to copy certificates with retries
            ATTEMPTS=0
            MAX_ATTEMPTS=6
            while [ \$ATTEMPTS -lt \$MAX_ATTEMPTS ]; do
              ATTEMPTS=\$((ATTEMPTS + 1))
              echo "Attempt \$ATTEMPTS of \$MAX_ATTEMPTS: Checking for certificates..."

              if sudo docker-compose exec -T tailscale ls /var/lib/tailscale/certs/ 2>/dev/null | grep -q ".crt"; then
                echo "Certificates found in Tailscale container!"
                sudo docker cp chor-dai-dee-tailscale:/var/lib/tailscale/certs/ ./certs/ 2>/dev/null && break
              fi

              if [ \$ATTEMPTS -lt \$MAX_ATTEMPTS ]; then
                sleep 5
              fi
            done

            # Restart client container to pick up certificates if they were copied
            if [ -f "./certs/certs/chor-dai-dee.tail83fc6d.ts.net.crt" ]; then
              echo "Certificates found, restarting client container with HTTPS support..."
              sudo docker-compose restart client
              echo "✅ HTTPS enabled with Tailscale Funnel - publicly accessible at https://chor-dai-dee.tail83fc6d.ts.net"
            else
              echo "Running with HTTP-only for now. HTTPS will be enabled on next deployment once certificates are available."
            fi

            # Remove .env file for security
            rm -f .env

            # Show status
            sudo docker-compose ps

            # Show logs (last 20 lines)
            sudo docker-compose logs --tail=20
          EOF

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/synology_key

      - name: Deployment complete
        run: |
          echo "✅ Deployment completed successfully!"
          echo "Application should be running on your Synology"
