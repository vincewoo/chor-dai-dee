# fly.toml app configuration file generated for chor-dai-dee on 2025-12-31T16:53:05-08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'chor-dai-dee'
primary_region = 'lax'

[build]
  [build.args]
    VITE_GOOGLE_CLIENT_ID = "677189818876-r0bt1l7qbi9n2v948jt4n35f21i0rh47.apps.googleusercontent.com"

[env]
  CLIENT_URL = "https://big2.onlyslop.dev"
  GOOGLE_CLIENT_ID = "677189818876-r0bt1l7qbi9n2v948jt4n35f21i0rh47.apps.googleusercontent.com"
  # Records full game histories to /data/gamelog.sqlite for offline model
  # training: the deal, the seating, and every action, for every game. There is
  # no per-player opt-out. Read at process start, so changing it needs a deploy
  # or a machine restart. Must be exactly "1" -- "true" leaves recording off.
  # See docs/GAME-STATE-HISTORY-STORE.md.
  GAMELOG_ENABLED = "1"
  # The server exits itself once it has been continuously idle -- no rooms and
  # no sockets -- for this many minutes, and Fly starts it again on the next
  # request (auto_start_machines). This is the knob that controls scale-to-zero,
  # not auto_stop_machines below. 360 = 6 hours.
  IDLE_SHUTDOWN_MINUTES = "360"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[mounts]
  source = "data"
  destination = "/data"
