# fly.toml app configuration file generated for chor-dai-dee on 2025-12-31T16:53:05-08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'chor-dai-dee'
primary_region = 'lax'

[build]
  [build.args]
    VITE_GOOGLE_CLIENT_ID = "677189818876-r0bt1l7qbi9n2v948jt4n35f21i0rh47.apps.googleusercontent.com"

[env]
  CLIENT_URL = "https://big2.onlyslop.dev"
  GOOGLE_CLIENT_ID = "677189818876-r0bt1l7qbi9n2v948jt4n35f21i0rh47.apps.googleusercontent.com"
  # Records full game histories to /data/gamelog.sqlite for offline model
  # training: the deal, the seating, and every action, for every game. There is
  # no per-player opt-out. Read at process start, so changing it needs a deploy
  # or a machine restart. Must be exactly "1" -- "true" leaves recording off.
  # See docs/GAME-STATE-HISTORY-STORE.md.
  GAMELOG_ENABLED = "1"
  # Promoted generation-18 PPO policy. Inference is pure JavaScript; Fly does
  # not need Python, CUDA, or a GPU. Set BOT_POLICY back to "heuristic" and
  # COACH_POLICY back to "move_quality" for a configuration-only rollback.
  BOT_POLICY = "ppo"
  BOT_PPO_OVERRIDE_MARGIN = "0.02"
  COACH_POLICY = "ppo"
  COACH_PPO_MIN_MARGIN = "2"
  COACH_PPO_OVERRIDE_MARGIN = "0.02"
  # Scale-to-zero is Fly's job (auto_stop_machines = 'suspend' below), so the
  # server's own idle exit is off. "0" disables it. A suspended machine keeps
  # its memory -- in-progress rooms included -- and resumes in well under a
  # second; exiting would throw both away and pay a full cold boot instead.
  IDLE_SHUTDOWN_MINUTES = "0"

[http_service]
  internal_port = 3000
  force_https = true
  # Fly's proxy suspends the machine a few minutes after the last connection
  # closes (an open Socket.io connection counts, so live games keep it awake)
  # and resumes it on the next request. Suspend snapshots RAM to disk, which
  # requires memory <= 2 GB and no swap -- both true below.
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  # 1 GB was sized for the advanced bot's TensorFlow runtime, which is gone --
  # the server is now plain Node. Measured RSS on this build: 75 MB idle,
  # 126 MB with 60 concurrent tables playing, 131 MB with those tables plus 300
  # idle sockets, settling back to 88 MB once the rooms drain. 512 MB is ~4x
  # the measured peak, which leaves room for page cache as gamelog.sqlite grows
  # and for `npm run gamelog:export`, whose game list scales with the corpus.
  # Re-measure before going lower: an OOM here drops live games.
  memory = '512mb'

[mounts]
  source = "data"
  destination = "/data"
